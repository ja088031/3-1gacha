<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firebase 書き込みテスト</title>
<style>
  body{font-family:sans-serif;margin:0;padding:16px;background:#f4f6fb;color:#222;}
  h1{font-size:20px;}
  p.note{font-size:13px;color:#555;line-height:1.6;}
  button{font-size:16px;padding:12px 20px;border:none;border-radius:8px;background:#3b6ef5;color:#fff;cursor:pointer;}
  button:disabled{background:#9bb0e8;}
  #box{margin-top:16px;padding:14px;border-radius:10px;background:#fff;font-size:15px;line-height:1.7;min-height:60px;}
  .ok{color:#0a8a3a;font-weight:bold;}
  .ng{color:#c0392b;font-weight:bold;}
  pre{background:#eef2fb;padding:10px;border-radius:6px;font-size:12px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;}
</style>
</head>
<body>
<h1>🔥 Firebase 書き込みテスト</h1>
<p class="note">
このボタンを押すと、Firestore に小さなデータを<b>1件書き込んで→すぐ読み戻し</b>ます。<br>
成功すれば「クラウド保存が学校Chromebookで本当に使える」ことが確定します。<br>
※Firestore を「テストモード」で作成済みであることが前提です。
</p>
<button id="run">書き込みテストを実行</button>
<div id="box">まだ実行していません。</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAc4XoJumywett0EkvWdFTCilS7Exdio6I",
  authDomain: "ondoku-3-1.firebaseapp.com",
  projectId: "ondoku-3-1",
  storageBucket: "ondoku-3-1.firebasestorage.app",
  messagingSenderId: "842895404150",
  appId: "1:842895404150:web:987333b09edcb2080a0357"
};

const box = document.getElementById("box");
let db;
try {
  const app = initializeApp(firebaseConfig);
  db = getFirestore(app);
} catch(e){
  box.innerHTML = `<span class="ng">初期化に失敗:</span> ${e.message}`;
}

document.getElementById("run").addEventListener("click", async (ev)=>{
  ev.target.disabled = true;
  box.innerHTML = "実行中… ⏳";
  try{
    const ref = doc(db, "nettest", "ping");
    const payload = { ts: Date.now(), msg: "hello from device", when: new Date().toLocaleString() };
    await setDoc(ref, payload);              // 書き込み
    const snap = await getDoc(ref);          // 読み戻し
    const got = snap.data();
    box.innerHTML =
      `<span class="ok">✅ 成功！クラウド保存が使えます。</span><br>` +
      `書き込んで読み戻したデータ:<pre>${JSON.stringify(got, null, 2)}</pre>` +
      `この結果を先生（開発者）に伝えてください。`;
  }catch(e){
    let hint = "";
    if(String(e.code).includes("permission-denied"))
      hint = "（Firestoreのルールが閉じています。テストモードで作り直すか、ルールを確認してください）";
    else if(String(e.message).toLowerCase().includes("network") || String(e.code).includes("unavailable"))
      hint = "（通信がブロックされている可能性。学校ネットワークでFirestoreがブロックされているとこのエラーになりますNG）";
    box.innerHTML =
      `<span class="ng">❌ 失敗</span> ${hint}<br><pre>code: ${e.code||"-"}\n${e.message}</pre>` +
      `この内容をそのまま先生（開発者）に伝えてください。`;
  }finally{
    ev.target.disabled = false;
  }
});
</script>
</body>
</html>
